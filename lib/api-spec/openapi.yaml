openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AI Text-to-Image Generator API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: images
    description: Image generation and management
  - name: collections
    description: Collection management
  - name: analytics
    description: Admin analytics
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /generate:
    post:
      operationId: generateImage
      tags: [images]
      summary: Generate images from a text prompt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateImageInput"
      responses:
        "201":
          description: Generation started or completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedImage"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /images:
    get:
      operationId: listImages
      tags: [images]
      summary: List generated images (history)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: search
          in: query
          schema:
            type: ["string", "null"]
        - name: style
          in: query
          schema:
            type: ["string", "null"]
        - name: favorite
          in: query
          schema:
            type: ["boolean", "null"]
        - name: startDate
          in: query
          schema:
            type: ["string", "null"]
        - name: endDate
          in: query
          schema:
            type: ["string", "null"]
      responses:
        "200":
          description: Paginated list of images
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImageListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /images/recent:
    get:
      operationId: listRecentImages
      tags: [images]
      summary: Get recent generated images for dashboard
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 8
      responses:
        "200":
          description: Recent images
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GeneratedImage"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /images/{id}:
    get:
      operationId: getImage
      tags: [images]
      summary: Get a specific image
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Image details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedImage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateImage
      tags: [images]
      summary: Update image metadata (prompt, title)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageUpdate"
      responses:
        "200":
          description: Updated image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedImage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteImage
      tags: [images]
      summary: Delete a generated image
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /images/{id}/favorite:
    patch:
      operationId: toggleFavorite
      tags: [images]
      summary: Toggle favorite status of an image
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedImage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /images/{id}/variations:
    post:
      operationId: createVariation
      tags: [images]
      summary: Create variations of an existing image
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VariationInput"
      responses:
        "201":
          description: Variation generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeneratedImage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /collections:
    get:
      operationId: listCollections
      tags: [collections]
      summary: List user's collections
      responses:
        "200":
          description: List of collections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Collection"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      operationId: createCollection
      tags: [collections]
      summary: Create a new collection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionInput"
      responses:
        "201":
          description: Created collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /collections/{id}:
    get:
      operationId: getCollection
      tags: [collections]
      summary: Get a collection with its images
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Collection details with images
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollectionDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateCollection
      tags: [collections]
      summary: Update a collection
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionUpdate"
      responses:
        "200":
          description: Updated collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteCollection
      tags: [collections]
      summary: Delete a collection
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /collections/{id}/images:
    post:
      operationId: addImageToCollection
      tags: [collections]
      summary: Add an image to a collection
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionImageInput"
      responses:
        "200":
          description: Image added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /collections/{id}/images/{imageId}:
    delete:
      operationId: removeImageFromCollection
      tags: [collections]
      summary: Remove an image from a collection
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: imageId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analytics/summary:
    get:
      operationId: getAnalyticsSummary
      tags: [analytics]
      summary: Get high-level analytics summary for admin dashboard
      responses:
        "200":
          description: Analytics summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsSummary"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analytics/daily:
    get:
      operationId: getDailyAnalytics
      tags: [analytics]
      summary: Get daily generation counts for chart
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: Daily analytics data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyStats"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analytics/styles:
    get:
      operationId: getStyleStats
      tags: [analytics]
      summary: Get generation counts broken down by style preset
      responses:
        "200":
          description: Style breakdown stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StyleStat"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    GenerateImageInput:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
          minLength: 1
        negativePrompt:
          type: ["string", "null"]
        style:
          type: ["string", "null"]
        size:
          type: string
          enum: ["1024x1024", "1536x1024", "1024x1536"]
          default: "1024x1024"
        quality:
          type: string
          enum: ["standard", "high"]
          default: "standard"
        seed:
          type: ["integer", "null"]

    ImageUpdate:
      type: object
      properties:
        prompt:
          type: ["string", "null"]
        title:
          type: ["string", "null"]

    VariationInput:
      type: object
      properties:
        prompt:
          type: ["string", "null"]
        style:
          type: ["string", "null"]

    GeneratedImage:
      type: object
      required: [id, prompt, imageUrl, size, style, isFavorite, generationTimeMs, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: ["string", "null"]
        prompt:
          type: string
        negativePrompt:
          type: ["string", "null"]
        title:
          type: ["string", "null"]
        imageUrl:
          type: string
        size:
          type: string
        style:
          type: ["string", "null"]
        quality:
          type: ["string", "null"]
        seed:
          type: ["integer", "null"]
        isFavorite:
          type: boolean
        generationTimeMs:
          type: integer
        createdAt:
          type: string

    ImageListResponse:
      type: object
      required: [images, total, page, limit]
      properties:
        images:
          type: array
          items:
            $ref: "#/components/schemas/GeneratedImage"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    Collection:
      type: object
      required: [id, name, imageCount, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: ["string", "null"]
        name:
          type: string
        description:
          type: ["string", "null"]
        coverImageUrl:
          type: ["string", "null"]
        imageCount:
          type: integer
        createdAt:
          type: string

    CollectionDetail:
      type: object
      required: [id, name, images, imageCount, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: ["string", "null"]
        name:
          type: string
        description:
          type: ["string", "null"]
        coverImageUrl:
          type: ["string", "null"]
        imageCount:
          type: integer
        images:
          type: array
          items:
            $ref: "#/components/schemas/GeneratedImage"
        createdAt:
          type: string

    CollectionInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: ["string", "null"]

    CollectionUpdate:
      type: object
      properties:
        name:
          type: ["string", "null"]
        description:
          type: ["string", "null"]

    CollectionImageInput:
      type: object
      required: [imageId]
      properties:
        imageId:
          type: integer

    AnalyticsSummary:
      type: object
      required: [totalImages, totalUsers, totalCollections, totalFavorites, imagesThisWeek, imagesThisMonth]
      properties:
        totalImages:
          type: integer
        totalUsers:
          type: integer
        totalCollections:
          type: integer
        totalFavorites:
          type: integer
        imagesThisWeek:
          type: integer
        imagesThisMonth:
          type: integer

    DailyStats:
      type: object
      required: [date, count]
      properties:
        date:
          type: string
        count:
          type: integer

    StyleStat:
      type: object
      required: [style, count]
      properties:
        style:
          type: string
        count:
          type: integer
